[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dacon-file-stacking"
version = "1.0.0"
description = "File-only stacking on current frozen DACON 236749 experts"
requires-python = ">=3.11"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
